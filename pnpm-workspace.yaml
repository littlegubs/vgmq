packages:
  - 'apps/*'
  - 'packages/*'

autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  bcrypt: true
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - bullmq@6.7.10
overrides:
  uuid: ^11.1.1
